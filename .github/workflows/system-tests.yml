name: System tests

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  snmpd-valgrind:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libsnmp-dev \
            python3-dev \
            python3-setuptools \
            snmp \
            snmpd \
            valgrind

      - name: Run API system tests and Valgrind
        run: sudo sh netsnmp/tests/system/run.sh
