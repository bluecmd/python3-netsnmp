[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "python3-netsnmp"
version = "1.1a2"
description = "The Net-SNMP Python Interface"
readme = { file = "README", content-type = "text/plain" }
requires-python = ">=3.6"
license = { text = "BSD" }
authors = [
    { name = "G. S. Marzot", email = "giovanni.marzot@sparta.com" },
]
maintainers = [
    { name = "Christian Svensson", email = "blue@cmd.nu" },
    { name = "Markus Häll", email = "soundgoof@gmail.com" },
]
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Monitoring",
]

[project.urls]
Homepage = "http://www.net-snmp.org"
Source = "https://github.com/bluecmd/python3-netsnmp"

# The C extension (net-snmp client bindings) is built from setup.py, which
# discovers the net-snmp libraries dynamically via net-snmp-config.
[tool.setuptools.packages.find]
include = ["netsnmp*"]
