name: System tests

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  snmpd-valgrind:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libsnmp-dev \
            python3-dev \
            python3-setuptools \
            snmp \
            snmpd \
            valgrind

      - name: Run API system tests and Valgrind
        run: sh netsnmp/tests/system/run.sh

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libsnmp-dev \
            python3-dev \
            python3-setuptools \
            snmp \
            snmpd

      - name: Run API system tests with C coverage
        run: sh netsnmp/tests/system/run-coverage.sh

      - name: Upload C coverage report
        uses: actions/upload-artifact@v4
        with:
          name: client-intf-coverage
          path: |
            client_intf-coverage.txt
            client_intf.c.gcov

  asan-ubsan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libsnmp-dev \
            python3-dev \
            python3-setuptools \
            snmp \
            snmpd

      - name: Run API system tests with ASan and UBSan
        run: sh netsnmp/tests/system/run-sanitizers.sh
